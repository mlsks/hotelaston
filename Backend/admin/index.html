<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Back-office · Aston La Scala</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314385c'/%3E%3Cpath d='M9 23 16 8l7 15M11.5 18h9' stroke='%23c9a45e' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="/admin/vendor/tailwind.js"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-chalk: #fbf8f2;
      --color-pebble: #efe8db;
      --color-azure-50: #f1f5f9;
      --color-azure-100: #e7eef5;
      --color-azure-500: #2e6a9a;
      --color-azure-700: #194469;
      --color-azure-800: #14385c;
      --color-azure-900: #0f2a45;
      --color-azure-950: #0b1f34;
      --color-brass: #a8834b;
      --color-gold: #c9a45e;
      --font-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    }
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-semibold whitespace-nowrap transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-azure-700 disabled:cursor-not-allowed disabled:opacity-50; }
      .btn-sm { @apply px-2.5 py-1.5 text-xs; }
      .btn-primary { @apply bg-azure-800 text-white shadow-sm hover:bg-azure-900; }
      .btn-secondary { @apply bg-white text-azure-800 ring-1 ring-inset ring-azure-800/25 hover:bg-azure-100; }
      .btn-ghost { @apply text-slate-600 hover:bg-slate-100 hover:text-slate-900; }
      .btn-danger { @apply bg-white text-rose-700 ring-1 ring-inset ring-rose-200 hover:bg-rose-50; }
      .input { @apply block w-full rounded-lg border-0 bg-white px-3 py-2 text-sm text-slate-900 ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-azure-700 focus:outline-none disabled:bg-slate-50 disabled:text-slate-500; }
      .label { @apply mb-1 block text-sm font-medium text-slate-700; }
      .hint { @apply mt-1 text-xs text-slate-500; }
      .card { @apply rounded-xl bg-white shadow-sm ring-1 ring-slate-200; }
      .badge { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium whitespace-nowrap ring-1 ring-inset; }
      .tab { @apply -mb-px border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-500 hover:text-slate-800; }
      .tab-active { @apply border-azure-800 text-azure-900; }
      .table { @apply w-full text-left text-sm; }
      .table th { @apply px-3 py-2 text-xs font-semibold tracking-wide whitespace-nowrap text-slate-500 uppercase; }
      .table td { @apply border-t border-slate-100 px-3 py-2.5 align-top; }
      .page-title { @apply font-serif text-3xl font-semibold text-azure-950; }
      .section-title { @apply text-base font-semibold text-slate-900; }
      .rich-bar { @apply flex flex-wrap items-center gap-0.5 rounded-t-lg bg-slate-50 px-1.5 py-1 ring-1 ring-inset ring-slate-300; }
      .rich-bar button { @apply rounded px-2 py-1 text-xs font-semibold text-slate-600 hover:bg-white hover:text-slate-900; }
      .rich-bar button.on { @apply bg-white text-azure-800 shadow-sm; }
      .rich-editor { @apply min-h-[4.5rem] rounded-t-none rounded-b-lg; }
    }
    @layer base {
      .prose-lite p { @apply my-1.5; }
      .prose-lite ul { @apply my-1.5 list-disc pl-5; }
      .prose-lite ol { @apply my-1.5 list-decimal pl-5; }
      .prose-lite a { @apply text-azure-700 underline; }
      .prose-lite strong, .prose-lite b { @apply font-semibold; }
      .banner-preview a { color: inherit; }
    }
    [x-cloak] { display: none !important; }
  </style>
  <script type="module" src="/admin/app.js"></script>
</head>
<body class="min-h-screen bg-chalk text-slate-900 antialiased" x-data>

  <!-- Démarrage -->
  <div x-show="$store.session.state === 'loading'" class="grid min-h-screen place-items-center text-slate-500">Chargement…</div>

  <!-- Connexion -->
  <main x-cloak x-show="$store.session.state === 'anonymous'" x-data="loginForm" class="grid min-h-screen place-items-center p-4">
    <form class="card w-full max-w-sm p-8" @submit.prevent="submit">
      <p class="text-xs font-semibold tracking-[0.2em] text-brass uppercase">Hôtel Aston La Scala</p>
      <h1 class="mt-1 font-serif text-3xl font-semibold text-azure-950">Back-office</h1>
      <div class="mt-6 space-y-4">
        <label class="block"><span class="label">E-mail</span>
          <input class="input" type="email" x-model="email" autocomplete="username" required></label>
        <label class="block"><span class="label">Mot de passe</span>
          <input class="input" type="password" x-model="password" autocomplete="current-password" required></label>
      </div>
      <p class="mt-3 min-h-5 text-sm font-medium text-rose-700" role="alert" x-text="error"></p>
      <button class="btn btn-primary mt-2 w-full" :disabled="busy" x-text="busy ? 'Connexion…' : 'Se connecter'"></button>
    </form>
  </main>

  <!-- Application -->
  <div x-cloak x-show="$store.session.state === 'ready'" x-data="shell" class="min-h-screen lg:pl-64">
    <div x-show="$store.ui.menuOpen" x-transition.opacity class="fixed inset-0 z-30 bg-azure-950/40 lg:hidden" @click="$store.ui.menuOpen = false"></div>
    <aside class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col bg-azure-950 text-azure-100 transition-transform lg:translate-x-0"
      :class="$store.ui.menuOpen && 'translate-x-0'">
      <a href="#/" class="block px-5 pt-5 pb-4">
        <span class="block text-[0.65rem] font-semibold tracking-[0.25em] text-gold uppercase">Hôtel Aston La Scala</span>
        <span class="mt-0.5 block font-serif text-2xl font-semibold text-white">Back-office</span>
      </a>
      <nav class="flex-1 overflow-y-auto px-3 pb-6">
        <template x-for="section in nav" :key="section.label || 'main'">
          <div class="mt-4">
            <p x-show="section.label" class="px-2 pb-1 text-[0.65rem] font-semibold tracking-[0.18em] text-azure-100/50 uppercase" x-text="section.label"></p>
            <template x-for="item in section.items" :key="item.href">
              <a :href="item.href" class="flex items-center gap-3 rounded-lg px-2.5 py-2 text-sm font-medium transition"
                :class="isActive(item.href) ? 'bg-white/10 text-white' : 'text-azure-100/80 hover:bg-white/5 hover:text-white'">
                <span class="shrink-0 opacity-80" x-html="$icon(item.icon)"></span><span x-text="item.label"></span>
              </a>
            </template>
          </div>
        </template>
      </nav>
      <div class="border-t border-white/10 px-5 py-4 text-xs text-azure-100/60">
        <a href="/fr/" target="_blank" rel="noopener" class="hover:text-white">Voir le site en ligne ↗</a>
      </div>
    </aside>

    <header class="sticky top-0 z-20 flex h-14 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur lg:px-8">
      <button class="btn btn-ghost -ml-2 px-2 lg:hidden" @click="$store.ui.menuOpen = true" aria-label="Ouvrir le menu">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <p class="min-w-0 flex-1 truncate font-medium text-slate-800" x-text="$store.route.title"></p>
      <button class="btn btn-secondary btn-sm" @click="$store.build.preview()" :disabled="$store.build.busy">
        <span x-text="$store.build.busy === 'preview' ? 'Génération…' : 'Prévisualiser'"></span>
      </button>
      <button x-show="$store.session.canPublish" class="btn btn-primary btn-sm" @click="$store.build.publish()" :disabled="$store.build.busy">
        <span x-text="$store.build.busy === 'publish' ? 'Publication…' : 'Publier'"></span>
      </button>
      <div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
        <button class="flex size-9 items-center justify-center rounded-full bg-azure-100 text-sm font-semibold text-azure-800" @click="open = !open"
          :aria-expanded="open" aria-label="Mon compte" x-text="($store.session.user?.name || '?').slice(0, 1).toUpperCase()"></button>
        <div x-show="open" x-transition.origin.top.right class="card absolute right-0 z-30 mt-2 w-64 p-2">
          <div class="px-3 py-2">
            <p class="truncate text-sm font-semibold" x-text="$store.session.user?.name"></p>
            <p class="truncate text-xs text-slate-500" x-text="$store.session.user?.email"></p>
            <p class="mt-1 text-xs text-brass" x-text="$store.session.roleLabel()"></p>
          </div>
          <a href="#/compte" class="block rounded-lg px-3 py-2 text-sm hover:bg-slate-100" @click="open = false">Mon compte</a>
          <button class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-100" @click="$store.session.logout()">Se déconnecter</button>
        </div>
      </div>
    </header>

    <main id="view" class="mx-auto max-w-7xl px-4 py-6 lg:px-8 lg:py-8"></main>
  </div>

  <!-- Notifications -->
  <div class="pointer-events-none fixed right-4 bottom-4 z-[70] flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-2" aria-live="polite">
    <template x-for="t in $store.toast.items" :key="t.id">
      <div class="pointer-events-auto flex items-start gap-3 rounded-xl px-4 py-3 text-sm shadow-lg ring-1"
        :class="t.kind === 'error' ? 'bg-rose-50 text-rose-900 ring-rose-200' : 'bg-azure-950 text-white ring-azure-900'">
        <p class="flex-1" x-text="t.text"></p>
        <a x-show="t.action" :href="t.action?.href" target="_blank" rel="noopener" class="font-semibold underline" x-text="t.action?.label"></a>
        <button class="opacity-60 hover:opacity-100" @click="$store.toast.close(t.id)" aria-label="Fermer">✕</button>
      </div>
    </template>
  </div>

  <!-- Fenêtre de confirmation / saisie / secret -->
  <div x-cloak x-show="$store.dialog.open" class="fixed inset-0 z-[60] grid place-items-center bg-azure-950/50 p-4" @keydown.escape.window="$store.dialog.open && $store.dialog.finish(false)">
    <form class="card w-full max-w-md p-6" @submit.prevent="$store.dialog.finish(true)">
      <h2 class="text-lg font-semibold" x-text="$store.dialog.title"></h2>
      <p class="mt-2 text-sm whitespace-pre-line text-slate-600" x-show="$store.dialog.body" x-text="$store.dialog.body"></p>
      <label x-show="$store.dialog.mode === 'prompt'" class="mt-4 block"><span class="label" x-text="$store.dialog.inputLabel"></span>
        <input class="input" x-model="$store.dialog.input"></label>
      <div x-show="$store.dialog.mode === 'secret'" class="mt-4 flex items-center gap-2">
        <code class="flex-1 rounded-lg bg-slate-100 px-3 py-2 font-mono text-sm break-all select-all" x-text="$store.dialog.secret"></code>
        <button type="button" class="btn btn-secondary btn-sm" @click="$store.dialog.copy()" x-text="$store.dialog.copied ? 'Copié' : 'Copier'"></button>
      </div>
      <template x-if="$store.dialog.checkbox">
        <label class="mt-4 flex items-start gap-2 text-sm">
          <input type="checkbox" class="mt-0.5" x-model="$store.dialog.checkbox.checked">
          <span x-text="$store.dialog.checkbox.label"></span>
        </label>
      </template>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" x-show="$store.dialog.mode !== 'secret'" class="btn btn-ghost" @click="$store.dialog.finish(false)">Annuler</button>
        <button class="btn" :class="$store.dialog.danger ? 'bg-rose-700 text-white hover:bg-rose-800' : 'btn-primary'" x-text="$store.dialog.confirmLabel"></button>
      </div>
    </form>
  </div>

  <!-- Résultat d'une publication -->
  <div x-cloak x-show="$store.build.result" class="fixed inset-0 z-[60] grid place-items-center bg-azure-950/50 p-4" @keydown.escape.window="$store.build.result = null">
    <div class="card w-full max-w-lg p-6">
      <template x-if="$store.build.result">
        <div x-data="{ get r() { return $store.build.result; } }">
          <h2 class="text-lg font-semibold" x-text="r.status === 'success' ? 'Le site est en ligne' : r.status === 'skipped' ? 'Rien à publier' : 'La publication a échoué'"></h2>
          <p class="mt-2 text-sm text-slate-600" x-show="r.status === 'success'">
            Version <strong x-text="'#' + r.id"></strong> · <span x-text="r.pages_count"></span> pages · langues <span x-text="(r.langs || []).join(', ').toUpperCase()"></span>.
          </p>
          <p class="mt-2 text-sm text-slate-600" x-show="r.status === 'skipped'">Aucune modification depuis la dernière publication : la version en ligne est conservée.</p>
          <p class="mt-2 text-sm font-medium text-rose-700" x-show="r.status === 'failed'" x-text="r.error"></p>
          <details x-show="r.warnings?.length" class="mt-4 text-sm">
            <summary class="cursor-pointer font-medium text-slate-700"><span x-text="r.warnings?.length"></span> point(s) à vérifier</summary>
            <ul class="mt-2 max-h-56 list-disc space-y-1 overflow-y-auto pl-5 text-slate-600">
              <template x-for="w in (r.warnings || []).slice(0, 60)"><li x-text="w"></li></template>
            </ul>
          </details>
          <div class="mt-6 flex justify-end gap-2">
            <a x-show="r.status !== 'failed'" href="/fr/" target="_blank" rel="noopener" class="btn btn-secondary">Voir le site</a>
            <button class="btn btn-primary" @click="$store.build.result = null">Fermer</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Sélecteur de médias -->
  <div x-cloak x-show="$store.picker.open" class="fixed inset-0 z-[55] grid place-items-center bg-azure-950/50 p-2 sm:p-6" @keydown.escape.window="$store.picker.open && $store.picker.cancel()">
    <div class="card flex max-h-full w-full max-w-5xl flex-col">
      <div class="flex flex-wrap items-center gap-3 border-b border-slate-200 p-4">
        <h2 class="flex-1 text-lg font-semibold">Choisir dans la médiathèque</h2>
        <input class="input w-56" type="search" placeholder="Rechercher…" x-model.debounce.400ms="$store.picker.q" @input.debounce.400ms="$store.picker.load()">
        <label x-show="$store.session.canContent" class="btn btn-secondary cursor-pointer">Envoyer un fichier
          <input type="file" class="sr-only" multiple :accept="$store.picker.kinds.map((k) => (k === 'document' ? 'application/pdf' : k + '/*')).join(',')" @change="$store.picker.upload([...$event.target.files]); $event.target.value = ''">
        </label>
        <button class="btn btn-ghost" @click="$store.picker.cancel()">Fermer</button>
      </div>
      <p x-show="$store.picker.uploading" class="px-4 pt-3 text-sm text-slate-600">
        Envoi de <span x-text="$store.picker.uploading?.name"></span>… <span x-text="Math.round(($store.picker.uploading?.progress || 0) * 100) + ' %'"></span>
      </p>
      <div class="grid flex-1 grid-cols-2 gap-3 overflow-y-auto p-4 sm:grid-cols-4 lg:grid-cols-6">
        <template x-for="m in $store.picker.items" :key="m.id">
          <button class="group overflow-hidden rounded-lg text-left ring-1 ring-slate-200 hover:ring-2 hover:ring-azure-700" @click="$store.picker.choose(m)" :disabled="m.status !== 'ready'">
            <div class="aspect-square bg-slate-100">
              <img x-show="m.thumb" :src="m.thumb" alt="" class="size-full object-cover" loading="lazy">
              <div x-show="!m.thumb" class="grid size-full place-items-center text-xs text-slate-500 uppercase" x-text="m.kind === 'document' ? 'PDF' : m.kind"></div>
            </div>
            <p class="truncate px-2 py-1.5 text-xs text-slate-600" x-text="m.original_name || m.embed_url"></p>
          </button>
        </template>
        <p x-show="!$store.picker.loading && !$store.picker.items.length" class="col-span-full py-10 text-center text-sm text-slate-500">Aucun média.</p>
      </div>
    </div>
  </div>
</body>
</html>
