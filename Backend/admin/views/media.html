<div x-data="mediaView" class="space-y-6" @dragover.prevent="dragging = canUpload" @dragleave.self="dragging = false" @drop.prevent="drop($event)">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="page-title">Médiathèque</h1>
      <p class="mt-1 text-slate-600">Photos, vidéos, sons et documents PDF du site. Les photos sont optimisées à l’envoi (WebP, plusieurs tailles, recadrage portrait pour mobile).</p>
    </div>
    <div class="flex flex-wrap items-center gap-2" x-show="canUpload">
      <input class="input w-40 font-mono text-xs" x-model="uploadFolder" :disabled="$store.session.isScoped" title="Dossier d’envoi" placeholder="/dossier">
      <label class="btn btn-primary cursor-pointer">Envoyer des fichiers
        <input type="file" class="sr-only" multiple accept="image/*,video/*,audio/*,application/pdf" @change="send([...$event.target.files]); $event.target.value = ''">
      </label>
    </div>
  </div>

  <div x-show="dragging" class="grid h-40 place-items-center rounded-xl border-2 border-dashed border-azure-700 bg-azure-100 text-azure-900">Déposez les fichiers pour les envoyer</div>

  <ul x-show="queue.length" class="card divide-y divide-slate-100 text-sm">
    <template x-for="(j, i) in queue" :key="i">
      <li class="flex items-center gap-3 px-4 py-2.5">
        <span class="min-w-0 flex-1 truncate" x-text="j.name"></span>
        <span class="text-xs text-slate-500" x-show="j.message" x-text="j.message"></span>
        <span class="w-28 text-right text-xs font-medium" :class="{ error: 'text-rose-700', done: 'text-emerald-700', duplicate: 'text-slate-500' }[j.state] || 'text-slate-600'"
          x-text="{ waiting: 'En attente', sending: j.progress < 1 ? Math.round(j.progress * 100) + ' %' : 'Traitement…', done: 'Prêt', duplicate: 'Doublon', error: 'Échec' }[j.state]"></span>
      </li>
    </template>
  </ul>

  <div class="grid gap-6 lg:grid-cols-[13rem_minmax(0,1fr)]">
    <aside class="space-y-5">
      <div>
        <p class="mb-1 text-xs font-semibold tracking-wide text-slate-500 uppercase">Dossiers</p>
        <button class="block w-full rounded-lg px-3 py-1.5 text-left text-sm" :class="!folder ? 'bg-azure-100 font-medium text-azure-900' : 'hover:bg-slate-100'" @click="folder = ''; load()">Tous</button>
        <template x-for="f in folders" :key="f.folder">
          <button class="flex w-full justify-between rounded-lg px-3 py-1.5 text-left text-sm" :class="folder === f.folder ? 'bg-azure-100 font-medium text-azure-900' : 'hover:bg-slate-100'" @click="folder = f.folder; load()">
            <span class="truncate font-mono text-xs" x-text="f.folder"></span><span class="text-xs text-slate-500" x-text="f.count"></span>
          </button>
        </template>
      </div>
      <label class="block"><span class="label">Type</span>
        <select class="input" x-model="kind" @change="load()">
          <option value="">Tous</option><option value="image">Images</option><option value="video">Vidéos</option><option value="audio">Sons</option><option value="document">Documents PDF</option><option value="embed">Liens externes</option>
        </select></label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="trash" @change="close(); load()"> Corbeille</label>
      <form x-show="canUpload" class="space-y-2 rounded-lg bg-white p-3 ring-1 ring-slate-200" @submit.prevent="addEmbed">
        <p class="text-sm font-medium">Lien externe</p>
        <input class="input" type="url" x-model="embedUrl" placeholder="https://www.youtube.com/…" required>
        <input class="input" x-model="embedTitle" placeholder="Titre (facultatif)">
        <button class="btn btn-secondary btn-sm w-full">Ajouter</button>
        <p class="hint">YouTube, Vimeo, Spotify… : chargé seulement au clic du visiteur.</p>
      </form>
    </aside>

    <div class="space-y-4">
      <input type="search" class="input max-w-sm" placeholder="Rechercher (nom, texte alternatif)…" x-model.debounce.400ms="q" @input.debounce.400ms="load()">
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 xl:grid-cols-5">
        <template x-for="m in items" :key="m.id">
          <button class="overflow-hidden rounded-xl bg-white text-left shadow-sm ring-1 transition" :class="current === m.id ? 'ring-2 ring-azure-700' : 'ring-slate-200 hover:ring-azure-700'" @click="open(m)">
            <div class="relative aspect-[4/3] bg-slate-100">
              <img x-show="m.thumb" :src="m.thumb" alt="" class="size-full object-cover" loading="lazy">
              <div x-show="!m.thumb" class="grid size-full place-items-center text-xs font-semibold text-slate-500 uppercase" x-text="{ embed: m.embed_provider || 'lien', document: 'PDF' }[m.kind] || m.kind"></div>
              <span x-show="m.status !== 'ready'" class="badge absolute top-2 left-2" :class="m.status === 'error' ? 'bg-rose-50 text-rose-700 ring-rose-200' : 'bg-amber-50 text-amber-800 ring-amber-200'"
                x-text="m.status === 'error' ? 'Erreur' : 'Traitement…'"></span>
              <span x-show="!['embed', 'document'].includes(m.kind) && m.i18n[$store.ui.lang]?.state !== 'ready'" class="badge absolute right-2 bottom-2 bg-white/90 text-rose-700 ring-rose-200" title="Texte alternatif manquant dans la langue de travail">alt</span>
            </div>
            <p class="truncate px-2.5 py-2 text-xs text-slate-600" x-text="m.original_name || m.embed_url"></p>
          </button>
        </template>
      </div>
      <p x-show="!loading && !items.length" class="card p-10 text-center text-slate-500" x-text="trash ? 'La corbeille est vide.' : 'Aucun média. Glissez des fichiers ici pour les envoyer.'"></p>
      <button x-show="items.length < total" class="btn btn-secondary" @click="load(true)">Afficher plus (<span x-text="total - items.length"></span>)</button>
    </div>
  </div>

  <!-- Détail -->
  <div x-show="detail" x-transition.opacity class="fixed inset-0 z-50 flex justify-end bg-azure-950/40" @click.self="close()" @keydown.escape.window="detail && close()">
    <template x-if="detail">
      <div class="flex h-full w-full max-w-2xl flex-col overflow-y-auto bg-white shadow-xl">
        <div class="flex items-center gap-3 border-b border-slate-200 px-5 py-3">
          <p class="min-w-0 flex-1 truncate font-medium" x-text="detail.original_name || detail.embed_url"></p>
          <button class="btn btn-ghost btn-sm" @click="close()">Fermer</button>
        </div>
        <div class="space-y-6 p-5">
          <!-- Aperçu -->
          <template x-if="detail.kind === 'image'">
            <div class="space-y-3">
              <div class="relative cursor-crosshair overflow-hidden rounded-lg bg-slate-100" @click="setFocal($event)" title="Cliquez sur le sujet principal : le recadrage portrait (mobile) se centre dessus">
                <img :src="large" alt="" class="w-full">
                <span class="pointer-events-none absolute size-6 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow ring-2 ring-azure-700"
                  :style="`left: ${(detail.focal_x ?? 0.5) * 100}%; top: ${(detail.focal_y ?? 0.5) * 100}%`"></span>
              </div>
              <div class="flex items-start gap-4">
                <img x-show="portrait" :src="portrait" alt="" class="h-32 rounded-md ring-1 ring-slate-200">
                <p class="text-sm text-slate-600">Cliquez sur le sujet principal de la photo : le recadrage portrait utilisé sur mobile se centre sur ce point.</p>
              </div>
            </div>
          </template>
          <template x-if="detail.kind === 'video'"><video controls preload="metadata" :src="original" :poster="poster" class="w-full rounded-lg bg-black"></video></template>
          <template x-if="detail.kind === 'audio'"><audio controls preload="metadata" :src="original" class="w-full"></audio></template>
          <template x-if="detail.kind === 'document'">
            <p class="text-sm"><a :href="original" target="_blank" rel="noopener" class="font-medium text-azure-700 underline">Ouvrir le document</a>
              <span class="ml-1 text-slate-500">· pour l’utiliser dans un menu ou une liste de liens : <a href="#/menus" class="underline">Menus et liens</a></span></p>
          </template>
          <template x-if="detail.kind === 'embed'">
            <p class="text-sm"><a :href="detail.embed_url" target="_blank" rel="noopener" class="break-all text-azure-700 underline" x-text="detail.embed_url"></a>
              <span class="ml-1 text-slate-500" x-text="detail.embed_provider ? '(' + detail.embed_provider + ')' : ''"></span></p>
          </template>

          <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm sm:grid-cols-4">
            <div x-show="detail.width"><dt class="text-xs text-slate-500">Dimensions</dt><dd x-text="detail.width + ' × ' + detail.height"></dd></div>
            <div x-show="detail.bytes"><dt class="text-xs text-slate-500">Poids</dt><dd x-text="$fmt.fmtBytes(detail.bytes)"></dd></div>
            <div x-show="detail.duration_s"><dt class="text-xs text-slate-500">Durée</dt><dd x-text="$fmt.fmtDuration(detail.duration_s * 1000)"></dd></div>
            <div><dt class="text-xs text-slate-500">Ajouté le</dt><dd x-text="$fmt.fmtDateTime(detail.created_at)"></dd></div>
          </dl>
          <ul x-show="detail.warnings?.length" class="space-y-1 rounded-lg bg-amber-50 px-4 py-3 text-sm text-amber-900">
            <template x-for="w in detail.warnings"><li x-text="w"></li></template>
          </ul>
          <p x-show="detail.status === 'error'" class="rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-800" x-text="detail.error"></p>

          <form class="space-y-5" @submit.prevent="saveDetail">
            <div class="space-y-4">
              <p class="section-title" x-text="['embed', 'document'].includes(detail.kind) ? 'Titre' : 'Texte alternatif, titre et légende'"></p>
              <p x-show="detail.kind === 'image'" class="hint -mt-2">Le texte alternatif décrit l’image pour les personnes malvoyantes et pour Google.</p>
              <template x-for="l in $store.session.languages" :key="l.code">
                <fieldset class="rounded-lg p-3 ring-1 ring-slate-200" :disabled="!$store.session.canTranslate(l.code)">
                  <legend class="flex items-center gap-2 px-1 text-sm font-medium"><span x-text="l.name"></span>
                    <span class="badge" :class="$fmt.stateClass(detail.i18n[l.code]?.state)" x-text="$fmt.stateLabel(detail.i18n[l.code]?.state)"></span></legend>
                  <div class="space-y-2">
                    <input x-show="!['embed', 'document'].includes(detail.kind)" class="input" x-model="i18n[l.code].alt" placeholder="Texte alternatif">
                    <input class="input" x-model="i18n[l.code].title" placeholder="Titre (facultatif)">
                    <input x-show="!['embed', 'document'].includes(detail.kind)" class="input" x-model="i18n[l.code].caption" placeholder="Légende (facultatif)">
                  </div>
                </fieldset>
              </template>
            </div>
            <div x-show="$store.session.canContent" class="grid gap-4 sm:grid-cols-2">
              <label class="block"><span class="label">Dossier</span><input class="input font-mono text-xs" x-model="detailForm.folder" :disabled="$store.session.isScoped"></label>
              <label class="block"><span class="label">Crédit photo</span><input class="input" x-model="detailForm.credit" placeholder="© …"></label>
            </div>
            <div x-show="detail.references?.length" class="text-sm">
              <p class="font-medium">Utilisé par</p>
              <ul class="mt-1 list-disc pl-5 text-slate-600"><template x-for="r in detail.references"><li x-text="r"></li></template></ul>
            </div>
            <div class="flex flex-wrap gap-2 border-t border-slate-100 pt-4">
              <button class="btn btn-primary" :disabled="saving" x-text="saving ? 'Enregistrement…' : 'Enregistrer'"></button>
              <button type="button" x-show="$store.session.canContent && !detail.deleted_at" class="btn btn-danger ml-auto" @click="remove()">Mettre à la corbeille</button>
            </div>
          </form>
        </div>
      </div>
    </template>
  </div>
</div>
