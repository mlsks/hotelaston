<div x-data="settingsView" class="space-y-6">
  <div>
    <h1 class="page-title">Réglages</h1>
    <p class="mt-1 text-slate-600">Paramètres communs à tout le site. Ils s’appliquent à la prochaine publication.</p>
  </div>
  <template x-if="form">
    <form class="space-y-6" @submit.prevent="save" @input="$store.ui.dirty = true">
      <section class="card grid gap-5 p-5 md:grid-cols-2">
        <h2 class="section-title md:col-span-2">Site</h2>
        <label class="block"><span class="label">Nom du site (partages sur les réseaux)</span><input class="input" x-model="form.og_site_name"></label>
        <label class="block"><span class="label">Langue proposée aux autres visiteurs (x-default)</span>
          <select class="input" x-model="form.x_default_lang">
            <template x-for="l in $store.session.languages" :key="l.code"><option :value="l.code" x-text="l.name" :selected="l.code === form.x_default_lang"></option></template>
          </select>
          <span class="hint block">Version montrée par Google aux internautes dont la langue n’est pas proposée.</span></label>
        <label class="block md:col-span-2"><span class="label">Image de partage par défaut</span>
          <div class="flex items-center gap-3"><img x-show="form.og_image_default" :src="form.og_image_default" alt="" class="h-14 rounded ring-1 ring-slate-200"><input class="input" type="url" x-model="form.og_image_default"></div></label>
        <label class="block md:col-span-2"><span class="label">Adresse des photos hébergées par l’ancien site (CDN)</span>
          <input class="input font-mono text-xs" x-model="form.cdn_base">
          <span class="hint block">Les photos des chambres et services sont encore servies depuis cette adresse, en attendant leur import dans la médiathèque.</span></label>
      </section>

      <section class="card grid gap-5 p-5 md:grid-cols-2">
        <h2 class="section-title md:col-span-2">Moteur de réservation (D-Edge)</h2>
        <label class="block md:col-span-2"><span class="label">Adresse du moteur</span><input class="input font-mono text-xs" x-model="form.booking_base" required>
          <span class="hint block"><code>{locale}</code> est remplacé par la langue de la page au format <code>fr-FR</code>, <code>{lang}</code> au format <code>fr</code>. Les dates, voyageurs, chambre et offre sont ajoutés par le site.</span></label>
        <label class="block md:col-span-2"><span class="label">Début commun des adresses du moteur</span><input class="input font-mono text-xs" x-model="form.booking_prefix">
          <span class="hint block">Sert à reconnaître, dans les textes, les liens qui mènent au moteur.</span></label>
        <fieldset class="md:col-span-2">
          <legend class="label">Noms des paramètres attendus par le moteur</legend>
          <span class="hint block">Laisser vide pour ne pas envoyer l’information. Dates au format AAAA-MM-JJ.</span>
          <div class="mt-2 grid gap-3 sm:grid-cols-2 md:grid-cols-4">
            <template x-for="[key, label] in [['checkin', 'Arrivée'], ['checkout', 'Départ'], ['nights', 'Nombre de nuits'], ['adults', 'Adultes'], ['children', 'Enfants'], ['guests', 'Total des voyageurs'], ['roomType', 'Chambre'], ['offerId', 'Offre']]" :key="key">
              <label class="block"><span class="hint block" x-text="label"></span><input class="input font-mono text-xs" x-model="form.booking_params[key]"></label>
            </template>
          </div>
        </fieldset>
        <label class="block"><span class="label">Codes chambre du moteur</span><textarea class="input font-mono text-xs" rows="6" x-model="form.booking_rooms"></textarea>
          <span class="hint block">Une ligne par chambre : <code>adresse de la chambre sur le site = code D-Edge</code>.</span></label>
        <label class="block"><span class="label">Codes tarif des offres</span><textarea class="input font-mono text-xs" rows="6" x-model="form.booking_offers"></textarea>
          <span class="hint block">Une ligne par offre : <code>adresse de l’offre sur le site = code D-Edge</code>.</span></label>
      </section>

      <section class="card grid gap-5 p-5 md:grid-cols-2">
        <h2 class="section-title md:col-span-2">Avis clients</h2>
        <p class="text-sm text-slate-600 md:col-span-2">Les avis, la note globale et le lien de la fiche Google se gèrent dans <a href="#/avis-google" class="text-azure-700 underline">Avis Google</a>.</p>
        <label class="block"><span class="label">Note moyenne affichée à partir de</span><input class="input w-32" type="number" step="0.1" min="0" max="5" x-model="form.rating_threshold">
          <span class="hint block">En dessous, la note moyenne de la fiche Google (chiffre et étoiles) n’apparaît sur aucune page ; les avis restent affichés.</span></label>
      </section>

      <details class="card p-5">
        <summary class="cursor-pointer section-title">Données structurées (JSON-LD) — réservé aux personnes à l’aise avec le format</summary>
        <p class="hint mt-2">Description de l’hôtel, du restaurant et des bars lue par Google et les assistants IA (adresse, téléphone, horaires, équipements, étoiles…). Un seul modèle pour toutes les langues : les clés Schema.org restent en anglais, et le build remplace dans chaque langue
          <code>{{clé}}</code> par le texte traduit (voir <a href="#/textes/jsonld" class="text-azure-700 underline">Données structurées</a>), <code>{{url:page}}</code> par l’adresse de la page dans la langue (par exemple <code>{{url:moon-bar}}</code>) et <code>{{inLanguage}}</code> par la langue de la page.</p>
        <label class="mt-4 block"><span class="label">Modèle</span>
          <textarea class="input font-mono text-xs" rows="16" x-model="jsonld" @change="checkJson()"></textarea>
          <span class="hint block text-rose-700" x-show="jsonError" x-text="jsonError"></span></label>
      </details>

      <div class="flex items-center gap-3">
        <button class="btn btn-primary" :disabled="saving" x-text="saving ? 'Enregistrement…' : 'Enregistrer'"></button>
        <span x-show="$store.ui.dirty" class="text-sm text-amber-700">Modifications non enregistrées</span>
      </div>

      <section class="card p-5">
        <h2 class="section-title">Maintenance</h2>
        <p class="mt-1 text-sm text-slate-600">Les médias mis à la corbeille sont effacés chaque nuit, sauf ceux qu’une version conservée du site utilise encore.</p>
        <button type="button" class="btn btn-secondary btn-sm mt-3" @click="mediaGc()">Effacer la corbeille maintenant</button>
      </section>
    </form>
  </template>
</div>
