<div x-data="collectionsView" class="space-y-6">
  <div>
    <h1 class="page-title">Fiches et listes</h1>
    <p class="mt-1 text-slate-600">Les contenus répétés du site : chaque chambre, chaque service, les offres, les avis, les réponses du chat, le programme des concerts.</p>
  </div>
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    <template x-for="c in collections" :key="c.key">
      <a :href="{ links: '#/menus', menus: '#/cartes' }[c.key] || '#/collections/' + c.key" class="card block p-5 transition hover:ring-azure-700">
        <p class="section-title" x-text="c.label"></p>
        <p class="mt-1 text-sm text-slate-600"><span x-text="c.items"></span> élément(s)</p>
        <p class="mt-3 text-xs text-slate-500" x-text="c.item_template ? 'Chaque élément a sa propre page' : 'Affichés dans les pages du site'"></p>
        <p class="text-xs text-slate-500" x-show="!translatable(c)">Pas de traduction (langue d’origine)</p>
      </a>
    </template>
  </div>
</div>
